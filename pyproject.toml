[project]
name = "veritaslayer"
version = "0.1.0"
description = "Research-grade digital content authenticity verification engine"
authors = [{name = "SarcasticApeSquad", email = "your@email.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "rich",
]

[project.optional-dependencies]
research = [
    "pillow",
    "imagehash",
    "numpy",
    "xxhash",
    "tldextract",
    "requests",
    "tqdm",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
veritaslayer = "veritaslayer.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
